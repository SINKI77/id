name: Sign Sinki feature config

on:
  push:
    paths:
      - "features.json"
      - ".github/workflows/sign-features.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign features.json with Ed25519
        env:
          SINKI_ED25519_PRIVATE_KEY_PEM: ${{ secrets.SINKI_ED25519_PRIVATE_KEY_PEM }}
        run: |
          test -n "$SINKI_ED25519_PRIVATE_KEY_PEM"
          printf '%s\n' "$SINKI_ED25519_PRIVATE_KEY_PEM" > /tmp/sinki-ed25519-private.pem
          openssl pkeyutl -sign -rawin -inkey /tmp/sinki-ed25519-private.pem -in features.json -out /tmp/features.json.sig
          base64 -w 0 /tmp/features.json.sig > features.json.sig
          printf '\n' >> features.json.sig
          rm -f /tmp/sinki-ed25519-private.pem /tmp/features.json.sig

      - name: Commit signature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features.json.sig
          git diff --cached --quiet || git commit -m "chore: update features signature"
          git push
